{% extends "base.html" %}
{% block title %}Results{% endblock %}
{% block head %}{{ super() }}{% endblock %}
{% block content %}
<div class="text-center">
    <h3>{{ race.data.description }} <br>{{ race.data.start_datetime|date }} {{ race.data.location }}</h3>
    <h2>Предварительный протокол Результатов</h2>
</div>
<div id="results-tables"></div>
{% raw %}
<style>
    table.table-split {
        margin: 0;
    }
    table.table-split td{
        border: 0 ! important;
        padding: 0;
    }
    table.table-split.correct {
        color: green;
    }
    table.table-split.incorrect {
        color: red;
    }

    table.sportorg-table th, table.sportorg-table td {
        border: 1px solid #ddd;
        text-align: center;
    }

    table.table-split td.result-undefined {
        border: none;
    }


</style>
<script>
    var race = {% endraw %}{{race|tojson}}{%raw %};
    var selected = {% endraw %}{{selected|tojson}}{%raw %};

    const Fields = {
        fields: [
            { key: 'index',          title: '№',           size: 4 },
            { key: 'group',          title: 'Группа',      size: 10, active: false },
            { key: 'name',           title: 'Фамилия Имя', size: 30 },
            { key: 'org',            title: 'Команда',     size: 20 },
            { key: 'year',           title: 'Г.Р.',        size: 5 },
            { key: 'bib',            title: 'Номер',       size: 6 },
            { key: 'trailo_score_penalty', title: 'ШтрафКВ', size: 9, active: false },
            { key: 'trailo_score',   title: 'Очки',        size: 4,  active: true  },  // по умолчанию видно в trailo
            { key: 'trailo_time',    title: 'Время',       size: 14 },
            { key: 'place_show',     title: 'Место',       size: 6 }
        ],

        active: function(key, val) {
            for (let obj of this.fields) {
                if (key === obj.key) {
                    obj.active = val;
                    return;
                }
            }
        },

        isActive: function(key) {
            for (let obj of this.fields) {
                if (key === obj.key) {
                    return obj.active !== false;   // undefined → true
                }
            }
            return true;
        },

        getField: function(key) {
            for (let obj of this.fields) {
                if (key === obj.key) return obj;
            }
            return null;
        },

        getCopyFields: function() {
            return JSON.parse(JSON.stringify(this.fields));
        },

        init: function() {
            // Можно здесь принудительно включить/выключить какие-то поля
            // this.active('trailo_score_penalty', true);
            return this;
        }
    }.init();

    function createSingleTdRow(text, className = '') {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        if (className) td.className = className;
        td.textContent = text;
        tr.appendChild(td);
        return tr;
    }

    function getCategoryId(category) {
        return category.id;
    }

    function getCategoryName(category) {
        return category.name;
    }

    // ────────────────────────────────────────────────
    // Единая функция подготовки результатов для категории
    // ────────────────────────────────────────────────

    function getResultsForCategory(category, count = 0, byCourse = false) {
        count = Number(count) || 0;
        const results = [];

        for (const res of race.results) {
            if (res.status === 13) continue;
            if (!res.person || !res.person.group) continue;

            const targetId = byCourse
                ? res.person.group?.course?.id
                : res.person.group?.id;

            if (targetId !== getCategoryId(category)) continue;

            const person = res.person;

            const row = {
                index: 0,
                name: `${person.surname} ${person.name}`.slice(0, MAX_PERSON_NAME),
                org: person.organization?.name?.slice(0, MAX_ORG_NAME) || '',
                qual: Qualification?.[person.qual] || '',
                bib: person.bib || '',
                year: person.birth_date ? new Date(person.birth_date).getFullYear() : '',
                trailo_score_penalty: res.trailo_score_penalty,
                trailo_score: res.trailo_score,
                trailo_time: res.trailo_time / 1000,
                result: res.result_current,
                result_msec: res.result_msec,
                place: res.place,
                status: res.status,
                place_show: person.is_out_of_competition ? 'в/з' :
                            (res.place > 0 ? res.place : ''),
                is_out_of_competition: person.is_out_of_competition,
                data: res
            };

            if (res.status !== 1) {
                row.place_show = '';
                row.trailo_score = '';
            }

            // ── Сплиты ───────────────────────────────────
            if (res.splits && store.splitsShow) {
                let ctrlIndex = 0;
                for (const split of res.splits) {
                    if (split.course_index <= 0 && split.code.slice(-2, -1) !== 'T') {
                        continue;
                    }

                    const isTimeCtrl = split.code.slice(-1) === 'T';
                    const key = `${ctrlIndex}_${split.code.slice(0, -1)}`;

                    const table = document.createElement('table');
                    table.className = 'table-split';

                    if (!isTimeCtrl) {
                        if (split.is_correct)   table.className += ' correct';
                        if (!split.is_correct)  table.className += ' incorrect';
                        table.appendChild(createSingleTdRow(split.code.slice(-1)));
                    } else {
                        table.appendChild(createSingleTdRow(split.time / 1000));
                    }

                    row[key] = table;
                    ctrlIndex++;
                }
            }

            results.push(row);
        }

        // Сортировка
        results.sort((a, b) => compareResults(a, b, byCourse));

        // Простановка порядковых номеров
        results.forEach((r, i) => r.index = i + 1);

        // Пересчёт мест при сортировке по очкам/времени (особенно для byCourse)
        if (byCourse) {
            recalculatePlaces(results);
        }

        return results;
    }

    // ────────────────────────────────────────────────
    // Сравнение результатов
    // ────────────────────────────────────────────────

    function compareResults(a, b, byCourse) {
        const isTrailo = race.settings?.result_processing_mode === 'trailo';

        // Не финишировавшие / дисквал. и т.п.
        if (a.status !== 1 || b.status !== 1) {
            if (a.status !== 1 && b.status !== 1) {
                return STATUS_PRIORITY.indexOf(a.status) - STATUS_PRIORITY.indexOf(b.status);
            }
            return a.status !== 1 ? 1 : -1;
        }

        // Вне зачёта
        if (a.is_out_of_competition || b.is_out_of_competition) {
            if (isTrailo && a.trailo_score !== b.trailo_score) {
                return b.trailo_score - a.trailo_score; // больше лучше
            }
            return a.trailo_time - b.trailo_time;
        }

        // Основная сортировка
        if (byCourse) {
            if (a.trailo_score !== b.trailo_score) {
                return b.trailo_score - a.trailo_score;
            }
            return a.trailo_time - b.trailo_time;
        }

        // По группам — по месту
        if (a.place < 1) return 1;
        if (b.place < 1) return -1;
        return a.place - b.place;
    }

    function recalculatePlaces(results) {
        if (!results.length) return;

        let place = 1;
        let prevScore = results[0].trailo_score;
        let prevTime  = results[0].trailo_time;
        let ties = 0;

        for (let i = 0; i < results.length; i++) {
            const r = results[i];

            if (r.is_out_of_competition || r.status !== 1) {
                r.place_show = r.place_show || '';
                continue;
            }

            if (r.trailo_score === prevScore && Math.abs(r.trailo_time - prevTime) < 0.01) {
                ties++;
                r.place = place;
            } else {
                place += ties + 1;
                ties = 0;
                r.place = place;
                prevScore = r.trailo_score;
                prevTime  = r.trailo_time;
            }

            r.place_show = r.place;
        }
    }

    // ────────────────────────────────────────────────
    // Основной рендер
    // ────────────────────────────────────────────────

    function render() {
        const container = document.getElementById('results-tables');
        if (!container) return;

        container.innerHTML = '';

        Fields.active('group', store.showProtocolByCourse);

        const categories = store.showProtocolByCourse ? race.courses : race.groups;

        categories.forEach(category => {
            const rows = getResultsForCategory(category, store.count, store.showProtocolByCourse);
            if (!rows.length) return;

            // Заголовок
            const h2 = document.createElement('h2');
            h2.id = category.name.replace(/\s+/g, '-');
            h2.textContent = getCategoryName(category);
            container.appendChild(h2);

            // Ссылки на группы (если режим по группам)
            if (!store.showProtocolByCourse && store.showLinkForGroups) {
                const linksBlock = getGroupsBlockElement?.(race);
                if (linksBlock) container.appendChild(linksBlock);
            }

            // Поля таблицы
            let fields = Fields.getCopyFields();

            // Добавляем колонки сплитов, если включено
            if (store.splitsShow) {
                const course = store.showProtocolByCourse ? category : (category.course || null);
                if (course?.controls) {
                    course.controls.forEach((ctrl, idx) => {
                        const isTime = ctrl.code.slice(-1) === 'T';
                        const title = isTime ? 'Время' : ctrl.code.slice(-1);
                        fields.push({
                            key: `${idx}_${ctrl.code.slice(0, -1)}`,
                            title: title,
                            size: 8
                        });
                    });
                }
            }

            const table = new TableGenerator(rows, fields).getTable({
                className: 'sportorg-table'
            });

            container.appendChild(table);
        });

        // Обновляем строку запроса
        const params = new URLSearchParams();
        params.set('s_splits', store.splitsShow ? '1' : '0');
        params.set('by_course', store.showProtocolByCourse ? '1' : '0');
        params.set('sportorg', '1');

        try {
            const base = location.pathname;
            history.replaceState(null, '', `${base}?${params}`);
        } catch (e) {}
    }

    // ────────────────────────────────────────────────
    // Инициализация и запуск
    // ────────────────────────────────────────────────

    racePreparation(race);

    // Глобальный store (если ещё не определён где-то выше)
    window.store = window.store || {
        showProtocolByCourse: location.href.includes('by_course=1'),
        splitsShow: true,
        showLinkForGroups: true,
        count: 0
    };

    render();

    // Настройки (чекбоксы и выбор количества)
    new SettingsGenerator([
        {
            title: 'По дистанциям',
            value: !!store.showProtocolByCourse,
            change: checked => {
                store.showProtocolByCourse = checked;
                render();
            }
        },
        {
            title: 'Разбивки',
            value: !!store.splitsShow,
            change: checked => {
                store.splitsShow = checked;
                render();
            }
        },
        {
            title: 'Показывать первых:',
            value: [
                {text: 'Все', value: 0},
                {text: '1',   value: 1},
                {text: '3',   value: 3},
                {text: '5',   value: 5},
                {text: '10',  value: 10}
            ],
            change: val => {
                store.count = val;
                render();
            }
        },
        {
            title: 'Автопрокрутка',
            value: false,
            change: checked => {
                // логика автопрокрутки, если нужна
            }
        }
    ]).show();
</script>
{% endraw %}
{% endblock %}
