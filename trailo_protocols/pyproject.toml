[project]
name = "trailo-protocols"
version = "0.1.0"
description = "TrailO Excel answer protocols from SportOrg event files"
requires-python = ">=3.8.1,<=3.14"
dependencies = [
  "openpyxl>=3.1,<4",
  "Pillow>=8,<12",
  "sportorg",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6,<7",
]

[project.scripts]
trailo-protocols = "trailo_protocols.__main__:run"
sportorg-trailo-excel-protocol = "trailo_protocols.plugin_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trailo_protocols"]

[tool.uv.sources]
sportorg = { path = "..", editable = true }

[dependency-groups]
dev = [
  "pytest>=7.4,<9.0",
  "PySide6>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
